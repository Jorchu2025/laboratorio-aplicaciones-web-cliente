<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="css/style.css">
	<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>

	<script type="module" defer src="js/api/api.js"></script>
	<script type="module" src="js/products/products.js"></script>
	<script type="module" src="js/components/categories.js"></script>
	<title>Mi Tienda</title>
</head>

<body>

	<header>
		<h1>Mi Tienda</h1>
		<button class="btn btn-primary" onclick="carrito.showModal()">🛒 Carrito</button>
	</header>

	<main>
		<div class="container m-4" id="categories">
			<h5 class="my-3">Categorías</h5>
			<div class="d-flex flex-wrap gap-1 row-gap-1" id="category-buttons"></div>
		</div>
		<div class="container m-4">
			<input type="text" id="search-input" class="form-control" placeholder="Buscar productos...">
		</div>
		<div id="prod-container" class="row container container-fluid gap-3"></div>

		<!-- Toasts -->
		<div class="toast-container position-absolute top-0 end-0 p-3">
			<!-- generado desde js -->
		</div>
		</div>
	</main>
	<dialog id="detalle" class="modal-detalle">
		<div class="modal-detalle-contenido">

			<h2>Detalle del producto</h2>

			<img src="/public/images/apple.webp" alt="Imagen del producto" class="modal-detalle-imagen">

			<h3>Nombre del producto</h3>

			<p class="modal-detalle-precio">$99.999</p>

			<p class="modal-detalle-descripcion">
				Descripción del producto. Aquí se mostrará información
				detallada sobre sus características.
			</p>

			<form method="dialog">
				<button class="btn btn-secondary">Cerrar</button>
			</form>

		</div>
	</dialog>
	<dialog id="carrito" class="modal-cart">
		<h2>Tu carrito</h2>
		<p>Tu carrito está vacío.</p>
		<form method="dialog">
			<button class="btn btn-secondary">Cerrar</button>
		</form>
	</dialog>

</body>

</html>
