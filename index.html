<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="css/style.css">
	<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>

	<script type="module" defer src="js/index.js"></script>
	<script type="module" defer src="js/api/api.js"></script>
	<script type="module" src="js/products/products.js"></script>
	<script type="module" src="/js/app.js" defer></script>
	<script type="module" src="js/components/categories.js"></script>
	<title>Mi Tienda</title>
</head>

<body>

<header class="bg-light border-bottom">
    <nav class="container d-flex flex-wrap justify-content-between align-items-center gap-3 py-3"
         aria-label="Navegación principal">
        <h1 class="h4 mb-0 d-flex align-items-center gap-2">
			<i class="bi bi-shop text-primary" aria-hidden="truw"></i>
			<span>Mi Tienda</span>
		</h1>

		<div class="navbar-search">
			<label for="search-input" class="visually-hidden">
				Buscar productos
			</label>
			<input
				type="search"
				id="search-input"
				class="form-control"
				placeholder="Buscar productos..."
			>
		</div>

        <button
            type="button"
            id="btn-carrito"
            class="btn btn-primary d-flex align-items-center gap-2"
        >
            <i class="bi bi-cart3" aria-hidden="true"></i>
            <span>Carrito</span>
        </button>
    </nav>
</header>

	<main>
		<p>Bienvenidos a nuestra tienda online.</p>

		<section class="container m-4" id="categories" aria-labelledby="categories-title">
			<h2 class="h5 my-3" id="categories-title">Categorías</h2>
			<div class="d-flex flex-wrap gap-1 row-gap-1" id="category-buttons"></div>
		</section>

		<section class="container my-4" aria-labelledby="products-title">
			<h2 class="visually-hidden" id="products-title">Catálogo de Productos</h2>
			<div id="prod-container" class="row g-3"></div>
		</section>

		<!-- Toasts -->
		<div class="toast-container position-fixed top-0 end-0 p-3">
			<!-- generado desde js -->
		</div>
	</main>

	<footer>
		<p>&copy; 2026 Mi Tienda</p>
	</footer>

	<dialog id="detalle" class="modal-detalle">
		<div class="modal-detalle-contenido">
			<button type="button" class="btn-cerrar-modal"
					aria-label="Cerrar detalle">×</button>

			<h2>Detalle del producto</h2>

			<img
				src="/public/images/apple.webp"
				alt="Imagen del producto"
				class="modal-detalle-imagen"
			>

			<h3>Nombre del producto</h3>

			<p class="modal-detalle-precio">$99.999</p>

			<p class="modal-detalle-descripcion">
				Descripción del producto. Aquí se mostrará información
				detallada sobre sus características.
			</p>

			<div id="contador-container"
				class="d-flex justify-content-center align-items-center gap-3 my-3">
				<!-- generado desde js -->
			</div>

			<button type="button" class="btn btn-primary" id="btn-agregar-modal">
				Agregar al carrito
			</button>

			<form method="dialog">
				<button class="btn btn-secondary">Cerrar</button>
			</form>
		</div>
	</dialog>

	<dialog id="carrito" class="modal-cart">

		<h2>Tu carrito</h2>
		<div id="cart-list"></div>
		<div id="cart-total" class="text-end fw-bold fs-5 mt-3">
         Total: $0.00
         </div>
		<div class="d-flex justify-content-between align-items-center mt-3">
			<button type="button" id="btn-clear-cart" class="btn btn-danger" disabled>Vaciar carrito</button>
			<form method="dialog" class="m-0">
				<button class="btn btn-secondary">Cerrar</button>
			</form>
		</div>
	</dialog>

</body>

</html>
